<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Placeholder webinar thumbnail">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#wbg)"/>

  <!-- subtle grid / screen texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <circle cx="88" cy="278" r="120" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="560" cy="70" r="90" fill="#FFFFFF" opacity="0.06"/>

  <!-- play button -->
  <g transform="translate(320 158)">
    <circle r="46" fill="#FFFFFF" opacity="0.95"/>
    <path d="M-15 -22 L26 0 L-15 22 Z" fill="#1D4ED8"/>
  </g>

  <text x="320" y="272" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.95"
        font-family="'Poppins','Segoe UI',sans-serif" font-size="22" font-weight="700"
        letter-spacing="0.5">Webinar</text>
  <text x="320" y="298" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7"
        font-family="'Poppins','Segoe UI',sans-serif" font-size="13" font-weight="500">Placeholder thumbnail</text>
</svg>
